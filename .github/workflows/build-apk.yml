name: Build Android APK

on:
  push:
    branches: [ "main" ] # با هر بار پوش به برنچ main اجرا می‌شود
  workflow_dispatch:      # امکان اجرای دستی از تب Actions را فراهم می‌کند

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ۱. دریافت کدهای پروژه
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ۲. نصب JDK (نسخه ۱۷ برای پروژه‌های مدرن اندروید توصیه می‌شود)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ۳. نصب اندروید SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ۴. دادن دسترسی اجرا به فایل gradlew
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ۵. کامپایل و ساخت فایل APK (حالت Release)
      - name: Build Release APK
        run: ./gradlew assembleRelease

      # ۶. آپلود فایل APK به عنوان Artifact (برای دانلود موقت)
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk

      # ۷. (اختیاری) انتشار خودکار APK در بخش Releases گیت‌هاب
      - name: Upload APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}